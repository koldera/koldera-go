name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a valid semantic version
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$GITHUB_REF_NAME" =~ $semver ]] || { echo "::error::$GITHUB_REF_NAME is not a semantic version tag"; exit 1; }
      - name: The tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # The full CI workflow for the tagged commit: nothing is released unless it passes.
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  oldest-go:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: oldstable
      - run: go test -race ./...

  github-release:
    needs: [ci, oldest-go]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi

  # Asks the Go module proxy to fetch the version so pkg.go.dev and `go get` see it. Works once the repository is
  # public; a private repository is not reachable by the proxy.
  warm-proxy:
    needs: github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - run: curl -fsS "https://proxy.golang.org/github.com/koldera/koldera-go/@v/$GITHUB_REF_NAME.info"
